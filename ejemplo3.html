<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volado - Sol o Águila</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f6d365, #fda085);
        color: #3d260f;
    }

    .game {
        width: 90%;
        max-width: 500px;
        padding: 35px;
        text-align: center;
        background: rgba(255,255,255,0.9);
        border-radius: 25px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    h1 {
        margin-top: 0;
        font-size: 2.5rem;
    }

    .subtitle {
        color: #76562d;
        margin-bottom: 25px;
    }

    /* Moneda */
    .coin-container {
        width: 220px;
        height: 220px;
        margin: 30px auto;
        perspective: 1000px;
    }

    .coin {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 3s cubic-bezier(.17,.67,.12,1.02);
    }

    .side {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        backface-visibility: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border: 10px solid #d39a22;
        background: radial-gradient(circle, #ffe98a, #d89b20);
        box-shadow:
            inset 0 0 0 5px #f5c94a,
            inset 0 0 25px rgba(120,70,0,.5),
            0 10px 20px rgba(0,0,0,.25);
    }

    .side span {
        font-size: 70px;
    }

    .side strong {
        font-size: 22px;
        margin-top: 5px;
        text-transform: uppercase;
    }

    .eagle {
        transform: rotateY(180deg);
    }

    /* Botón */
    button {
        border: none;
        padding: 15px 35px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        color: white;
        background: #a85d16;
        box-shadow: 0 5px 0 #713d0d;
        transition: .2s;
    }

    button:hover {
        transform: translateY(-2px);
        background: #bd6b1b;
    }

    button:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #713d0d;
    }

    button:disabled {
        opacity: .6;
        cursor: not-allowed;
    }

    #result {
        min-height: 35px;
        margin: 25px 0 15px;
        font-size: 24px;
        font-weight: bold;
    }

    .stats {
        display: flex;
        justify-content: space-around;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 2px solid #e7c98a;
    }

    .stat {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .stat span {
        font-size: 28px;
        font-weight: bold;
    }

    .reset {
        margin-top: 20px;
        padding: 9px 20px;
        font-size: 14px;
        background: transparent;
        color: #8b551e;
        box-shadow: none;
        border: 1px solid #c8954a;
    }

    .reset:hover {
        background: #f8e5bd;
    }

</style>
</head>

<body>

<div class="game">

    <h1>🪙 Volado</h1>

    <p class="subtitle">
        ¿Sol o Águila?
    </p>

    <div class="coin-container">
        <div class="coin" id="coin">

            <div class="side sun">
                <span>☀️</span>
                <strong>Sol</strong>
            </div>

            <div class="side eagle">
                <span>🦅</span>
                <strong>Águila</strong>
            </div>

        </div>
    </div>

    <div id="result">
        ¡Lanza la moneda!
    </div>

    <button id="flipButton" onclick="flipCoin()">
        Lanzar moneda
    </button>

    <div class="stats">

        <div class="stat">
            <span id="sunCount">0</span>
            <small>☀️ Sol</small>
        </div>

        <div class="stat">
            <span id="eagleCount">0</span>
            <small>🦅 Águila</small>
        </div>

        <div class="stat">
            <span id="totalCount">0</span>
            <small>Volados</small>
        </div>

    </div>

    <button class="reset" onclick="resetGame()">
        Reiniciar
    </button>

</div>

<script>

let sunCount = 0;
let eagleCount = 0;
let total = 0;

let rotation = 0;
let lanzamientoPendiente = null;

function flipCoin() {

    const coin = document.getElementById("coin");
    const button = document.getElementById("flipButton");
    const result = document.getElementById("result");

    button.disabled = true;
    result.textContent = "🪙 Lanzando...";

    // 0 = Sol, 1 = Águila
    const outcome = Math.random() < 0.5 ? "sun" : "eagle";

    /*
        Cada lanzamiento agrega varias vueltas.
        Si sale Sol termina mostrando la cara frontal.
        Si sale Águila termina mostrando la cara trasera.
    */

    const extraSpins = 5 * 360;

    if (outcome === "sun") {
        rotation += extraSpins;

    } else {
        rotation += extraSpins + 180;
    }

    coin.style.transform = `rotateY(${rotation}deg)`;

    lanzamientoPendiente = setTimeout(() => {
        lanzamientoPendiente = null;

        total++;

        if (outcome === "sun") {
            sunCount++;
            result.textContent = "☀️ ¡Salió SOL!";
        } else {
            eagleCount++;
            result.textContent = "🦅 ¡Salió ÁGUILA!";
        }

        updateStats();

        button.disabled = false;

    }, 3000);
}


function updateStats() {

    document.getElementById("sunCount").textContent = sunCount;
    document.getElementById("eagleCount").textContent = eagleCount;
    document.getElementById("totalCount").textContent = total;

}


function resetGame() {

    if (lanzamientoPendiente !== null) {
        clearTimeout(lanzamientoPendiente);
        lanzamientoPendiente = null;
    }

    sunCount = 0;
    eagleCount = 0;
    total = 0;

    rotation = 0;

    document.getElementById("flipButton").disabled = false;
    document.getElementById("coin").style.transform =
        "rotateY(0deg)";

    document.getElementById("result").textContent =
        "¡Lanza la moneda!";

    updateStats();
}

</script>

</body>
</html>
